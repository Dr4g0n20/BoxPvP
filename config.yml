# ============================================================
#  BoxPvP configuration  (use /boxpvp reload after editing)
#  Colour codes use & (e.g. &6 = gold).
# ============================================================

prefix: "&8[&6BoxPvP&8] &7"
autosave-minutes: 5
teleport-to-spawn-on-join: true
death-messages: true          # show the normal death message
keep-level: true              # keep XP levels on death (inventory is always kept)
combat-tag-seconds: 10        # /spawn is blocked for this long after PvP damage

# Default value of each region flag when NO region sets it.
default-flags:
  pvp: true
  build: true
  fall-damage: true
  mob-spawn: true
  item-drop: true
  xp-rain: false
  hunger: false              # false = nobody loses hunger (default). true = normal hunger. Per-region: /region flag <name> hunger allow

coins:
  per-kill: 10
  streak-bonus-per-kill: 2     # extra coins per kill of your current streak (after the 1st)
  streak-bonus-cap: 40         # max streak bonus
  streak-break-bonus: 3        # coins per kill of the victim's streak when you end it
  streak-break-cap: 60
  death-penalty: 0             # coins lost on death
  anti-farm-seconds: 60        # killing the same player again within this time gives no coins

killstreak:
  announce-end-at: 5           # broadcast when a streak of at least this many is ended (0 = never)
  # Reward keys are the streak number that triggers them.
  # Options: coins, items (MATERIAL[:data][*amount]), commands (%player%), message, broadcast
  rewards:
    3:
      coins: 25
      message: "&a&lKILLSTREAK! &7You are on a &e3 &7kill streak!"
    5:
      coins: 50
      items:
        - "GOLDEN_APPLE*2"
      broadcast: "&6%player% &eis on a &c5 &ekill streak!"
    10:
      coins: 150
      items:
        - "GOLDEN_APPLE*4"
        - "ENDER_PEARL*2"
      broadcast: "&6&l%player% &eis on a &c&l10 &ekill streak!"
    20:
      coins: 400
      items:
        - "GOLDEN_APPLE:1*1"
      broadcast: "&4&l%player% &cIS UNSTOPPABLE &7(&e20 &7kill streak!)"

scoreboard:
  enabled: true
  title: "&6&lBOX PVP"
  # Placeholders: %kills% %deaths% %assists% %ores% %kdr% %streak% %best% %coins% %name% %rank% %title%
  lines:
    - ""
    - "&7Kills: &f%kills%"
    - "&7Deaths: &f%deaths%"
    - "&7K/D: &f%kdr%"
    - "&7Streak: &e%streak%"
    - "&7Best: &e%best%"
    - ""
    - "&6Coins: &e%coins%"

# Enchant-bottle rain. Applies to every region with the xp-rain flag set to allow.
# Bottles spawn at the TOP layer of the region, so make the region's top layer the
# air just under your ceiling.
xp-rain:
  interval-ticks: 20
  bottles-per-pulse: 3
  xp-per-bottle: 8

# Launch pads. Pads must be this block type (stand on it and use /launchpad create).
# Stepping on one seats you on an invisible armour stand that the server glides to the landing point
# (smooth start and stop), then places you exactly on it.
launchpad:
  block: GOLD_BLOCK
  immunity-seconds: 4          # damage immunity after landing (ends instantly if you attack)
  flight-speed: 1.0            # average blocks per tick (20 ticks = 1 second) - higher = faster flights
  min-ticks: 14                # shortest possible flight
  max-ticks: 160               # longest possible flight
  default-arc: 0.0             # extra height at mid-flight in blocks. 0 = dead straight line (override per pad with /launchpad arc)
  seat-offset: 0.35            # height tweak for the invisible seat; raise/lower if riders look sunk or floating
  cooldown-ms: 1500

mines:
  regen-seconds: 8
  require-pickaxe-tier: true   # ores need the right pickaxe (stone for iron, iron for gold/diamond...)
  tool-wear: true              # mining wears down the pickaxe
  max-fill-blocks: 200000      # safety limit for /mine fill
  # Blocks that fill/regenerate a mine and their weights (override per mine with /mine block).
  default-blocks:
    COBBLESTONE: 40
    COAL_ORE: 20
    IRON_ORE: 18
    GOLD_ORE: 8
    REDSTONE_ORE: 6
    LAPIS_ORE: 5
    DIAMOND_ORE: 3
  # Auto-smelt: what each mined drop turns into. (Cobblestone is NOT smelted by default
  # because players need it to craft stone tools - add COBBLESTONE: STONE if you want that.)
  smelt:
    IRON_ORE: IRON_INGOT
    GOLD_ORE: GOLD_INGOT
    SAND: GLASS
    NETHERRACK: NETHER_BRICK_ITEM

shop:
  # SELLER NPC = players BUY supplies from it.   BUYER NPC = players SELL resources to it.
  seller-npc-name: "&6&lSeller"
  buyer-npc-name: "&b&lBuyer"
  buy-menu-title: "&b&lSupply Shop"       # menu opened from the Seller NPC
  sell-menu-title: "&6&lSell Resources"   # menu opened from the Buyer NPC
  # --- what players can SELL to the Buyer NPC ---
  # item: MATERIAL or "MATERIAL:data"   price: coins   name: optional display name
  sell:
    - {item: COBBLESTONE, price: 1}
    - {item: COAL, price: 2}
    - {item: REDSTONE, price: 1}
    - {item: "INK_SACK:4", price: 2, name: "Lapis Lazuli"}
    - {item: IRON_INGOT, price: 6}
    - {item: GOLD_INGOT, price: 10}
    - {item: DIAMOND, price: 40}
    - {item: EMERALD, price: 50}
  # --- what players can BUY from the Seller NPC ---
  # amount: optional stack size.  potion: optional PotionType (item must be POTION or SPLASH_POTION)
  # upgraded / extended: optional true/false for potions.
  buy:
    - {item: ENDER_PEARL, price: 80}
    - {item: ARROW, price: 20, amount: 16}
    - {item: GOLDEN_APPLE, price: 120}
    - {item: "GOLDEN_APPLE:1", price: 900, name: "Enchanted Golden Apple"}
    - {item: WEB, price: 40, amount: 2, name: "Cobweb"}
    - {item: WATER_BUCKET, price: 40}
    - {item: FLINT_AND_STEEL, price: 50}
    - {item: TNT, price: 150, amount: 2}
    - {item: SHIELD, price: 120}
    - {item: SPLASH_POTION, potion: INSTANT_HEAL, upgraded: true, price: 100, name: "Splash Healing II"}
    - {item: POTION, potion: SPEED, price: 90, name: "Potion of Speed"}
    - {item: POTION, potion: FIRE_RESISTANCE, price: 90, name: "Fire Resistance"}

# Training dummy (/dummy create). Can't be hurt or knocked back; shows your DPS as you hit it.
dummy:
  name: "&c&lTraining Dummy"
  session-timeout-seconds: 5   # a DPS "session" ends after this long without a hit
  actionbar: true              # live readout above the hotbar on every hit
  chat-summary: true           # results in chat when you stop hitting it

# Exploit protection
combat-log:
  enabled: true                # quitting within combat-tag-seconds of PvP counts as a death (and a kill for your opponent)

pearls:
  cooldown-seconds: 10         # ender pearl cooldown (0 = off)
  block-into-safe-zones: true  # can't pearl / chorus-fruit from a PvP area into a no-PvP region (pearl is refunded)

# Combat
combat-timer:
  actionbar: true              # "In combat: 8s" above the hotbar while you are combat-tagged
combat-zones:
  block-entry: true            # combat-tagged players can't walk/launch into no-PvP regions (they're knocked back)

# Kill assists: players who hurt the victim recently (but didn't land the kill) get credit
assists:
  enabled: true
  window-seconds: 15           # damage only counts if dealt within this long before the kill
  min-damage: 4.0              # at least this much damage (2 hearts) to earn an assist
  coins: 5                     # coins per assist (0 = stat only)

# /pay <player> <amount>
pay:
  enabled: true
  min-amount: 1
  cooldown-seconds: 3

# Cosmetic ranks (/rank ...) and clans (/clan ...). Admin-only; they grant no permissions.
# Shown as  [rank] username [clan]  in chat, above heads and in the tab list.
ranks:
  chat-prefix: true            # false = leave chat completely alone
nametags:
  enabled: true                # rank/clan above heads and in the tab list (1.12 limits each to 16 characters)
chat:
  # %rank% %player% %clan% %message%   (%rank% / %clan% are blank for players who don't have one)
  format: "%rank%&f%player%%clan%&7: &f%message%"

# Achievement titles: cosmetic ranks earned automatically from stats. Reach a tier's amount to earn its title.
# They show where a rank would (chat, above the head, tab list) for players who have no admin-given rank.
# Players pick which earned title to show with /title. Stats you can track:
#   ores (blocks mined in mines)  kills  assists  streak (best killstreak)  sold (items sold to the Buyer)
# name = full text used in chat and /title.  tag = short text (about 12 characters) for above heads and the tab list.
achievements:
  enabled: true
  broadcast-min-tier: 3        # announce to the whole server from this tier up (0 = never)
  tracks:
    grinder:
      stat: ores
      tiers:
        - {amount: 1000,   name: "&a[Master Grinder]",   tag: "&a[MGrind]"}
        - {amount: 10000,  name: "&b[Elite Grinder]",    tag: "&b[EGrind]"}
        - {amount: 100000, name: "&d[Ultimate Grinder]", tag: "&d[UGrind]"}
    slayer:
      stat: kills
      tiers:
        - {amount: 100,   name: "&e[Slayer]",           tag: "&e[Slayer]"}
        - {amount: 1000,  name: "&6[Elite Slayer]",     tag: "&6[ESlayer]"}
        - {amount: 10000, name: "&c[Legendary Slayer]", tag: "&c[LSlayer]"}
    wingman:
      stat: assists
      tiers:
        - {amount: 50,   name: "&a[Helper]",   tag: "&a[Helper]"}
        - {amount: 500,  name: "&b[Wingman]",   tag: "&b[Wingman]"}
        - {amount: 5000, name: "&6[Guardian]",  tag: "&6[Guard]"}
    streaker:
      stat: streak
      tiers:
        - {amount: 10, name: "&a[Rampage]",     tag: "&a[Rampage]"}
        - {amount: 25, name: "&6[Unstoppable]", tag: "&6[Unstop]"}
        - {amount: 50, name: "&c[Godlike]",     tag: "&c[Godlike]"}
    trader:
      stat: sold
      tiers:
        - {amount: 1000,   name: "&a[Merchant]", tag: "&a[Merch]"}
        - {amount: 10000,  name: "&6[Tycoon]",   tag: "&6[Tycoon]"}
        - {amount: 100000, name: "&d[Mogul]",    tag: "&d[Mogul]"}

# The Upgrader NPC (/npc create upgrader): hold a pickaxe, sword or axe, right-click it, and pay coins to add enchantments.
# Each entry: enchant = Bukkit name, max = top level, prices = coins for level 1, level 2, ... (one per level).
# Up to 9 entries per item type. "enchants" is the PICKAXE list (kept under its original name).
# Bukkit names: DIG_SPEED = Efficiency, DURABILITY = Unbreaking, LOOT_BONUS_BLOCKS = Fortune, DAMAGE_ALL = Sharpness,
#   FIRE_ASPECT, KNOCKBACK, MENDING, DAMAGE_UNDEAD = Smite, LOOT_BONUS_MOBS = Looting, SWEEPING_EDGE
# Note: Fortune multiplies mine drops here, including auto-smelted ingots. Unbreaking and Mending work in mines too
# (Mending repairs from the XP bottles in your enchanting area). Sharpness / Fire Aspect / Knockback change PvP balance,
# so price them to suit your server.
upgrader:
  title: "&5&lUpgrader"
  npc-name: "&5&lUpgrader"
  enchants:
    - {enchant: DIG_SPEED, name: "Efficiency", max: 5, prices: [100, 250, 500, 1000, 2000]}
    - {enchant: DURABILITY, name: "Unbreaking", max: 3, prices: [150, 400, 900]}
    - {enchant: LOOT_BONUS_BLOCKS, name: "Fortune", max: 3, prices: [300, 800, 2000]}
    - {enchant: MENDING, name: "Mending", max: 1, prices: [1500]}
  sword-enchants:
    - {enchant: DAMAGE_ALL, name: "Sharpness", max: 5, prices: [200, 500, 1000, 2000, 4000]}
    - {enchant: FIRE_ASPECT, name: "Fire Aspect", max: 2, prices: [400, 1200]}
    - {enchant: KNOCKBACK, name: "Knockback", max: 2, prices: [300, 800]}
    - {enchant: DURABILITY, name: "Unbreaking", max: 3, prices: [150, 400, 900]}
    - {enchant: MENDING, name: "Mending", max: 1, prices: [1500]}
  axe-enchants:
    - {enchant: DAMAGE_ALL, name: "Sharpness", max: 5, prices: [200, 500, 1000, 2000, 4000]}
    - {enchant: DIG_SPEED, name: "Efficiency", max: 5, prices: [100, 250, 500, 1000, 2000]}
    - {enchant: DURABILITY, name: "Unbreaking", max: 3, prices: [150, 400, 900]}
    - {enchant: MENDING, name: "Mending", max: 1, prices: [1500]}

# ===================================================================================================
# CUSTOM ENCHANTS
# Pull them from the Enchanter NPC (/npc create enchanter), apply them to a tool at the Upgrader, level them up with
# coins there. Every pull gives the enchant at level 1. Each tool has a limited number of custom-enchant slots, which
# you can also buy at the Upgrader. A pulled enchant is kept on the player's account until applied (it's used up then);
# right-clicking an applied enchant in the Upgrader removes it and returns it to the collection at level 1.
# Percent values are percentages (1.0 = 1%). prices = coins to go from level 1->2, 2->3, ... (one entry per upgrade).
# ===================================================================================================
enchanter:
  title: "&d&lEnchanter"
  npc-name: "&d&lEnchanter"

custom-enchants:
  enabled: true
  base-slots: 1                # slots every tool starts with
  max-slots: 4                 # most slots a tool can have (maximum 9)
  slot-prices: [1500, 4000, 10000]   # coins to unlock slot 2, 3, 4 ...
  pull-prices:
    random: 100                # random tool, random enchant
    tool: 1000                 # you choose the tool, random enchant
    choose: 10000              # you choose the exact enchant
  count-bonus-blocks-as-ores: false  # do blocks mined by Explosion / Vein Miner count toward the ores stat + Grinder titles?
  enchants:
    # ---------- PICKAXE (only works on mine blocks, except where noted) ----------
    explosion:                 # chance to mine every mine block in a sphere (cosmetic explosion only - nothing is destroyed)
      max: 5
      prices: [500, 1500, 4000, 10000]
      chance-per-level: 1.0
      radius: 3
      max-blocks: 125          # safety cap per explosion
    vein_miner:                # chance to mine the whole connected ore vein
      max: 5
      prices: [400, 1200, 3000, 8000]
      chance-per-level: 4.0
      base-blocks: 4           # vein size = base-blocks + blocks-per-level * level
      blocks-per-level: 2
    jackpot:                   # chance for a bonus gem when you mine a block
      max: 5
      prices: [400, 1200, 3000, 8000]
      chance-per-level: 1.0
      items: ["DIAMOND*1", "EMERALD*1"]   # one is picked at random (MATERIAL[:data][*amount])
    midas:                     # chance for instant bonus coins when you mine a block
      max: 5
      prices: [300, 900, 2500, 6000]
      chance-per-level: 3.0
      coins-per-level: 2       # bonus is 1 to (coins-per-level * level) coins
    momentum:                  # mine quickly to stack Haste (level = highest Haste you can reach)
      max: 3
      prices: [500, 2000]
      window-seconds: 3        # keep mining within this gap to keep the streak
      blocks-per-stage: 5      # every 5 blocks raises Haste by one level
      duration-ticks: 80
    quick_regen:               # blocks YOU mine regenerate faster
      max: 5
      prices: [300, 900, 2500, 6000]
      reduction-percent-per-level: 10
    # ---------- SWORD (PvP) ----------
    lifesteal:                 # heal a percentage of the damage you deal
      max: 5
      prices: [400, 1200, 3000, 8000]
      percent-per-level: 4
    execute:                   # bonus damage against low-health targets
      max: 5
      prices: [400, 1200, 3000, 8000]
      threshold-percent: 30
      bonus-percent-per-level: 6
    frenzy:                    # consecutive hits stack bonus damage
      max: 5
      prices: [400, 1200, 3000, 8000]
      window-seconds: 3
      max-stacks: 5
      percent-per-stack-per-level: 1.0
    streak_surge:              # bonus damage from your current killstreak
      max: 5
      prices: [500, 1500, 4000, 10000]
      percent-per-streak-per-level: 0.4
      cap-percent: 30
    frostbite:                 # chance to slow the target
      max: 5
      prices: [300, 900, 2500, 6000]
      chance-per-level: 6
      seconds: 2
      slow-amplifier: 1        # 0 = Slowness I, 1 = Slowness II
    thunderstrike:             # chance for a lightning visual and bonus damage
      max: 5
      prices: [400, 1200, 3000, 8000]
      chance-per-level: 3
      bonus-damage: 3.0
    hunters_mark:              # your hits make the target glow (stops camping)
      max: 3
      prices: [300, 900]
      seconds-per-level: 1
    # ---------- AXE ----------
    cleave:                    # your hit also damages other players near the target
      max: 5
      prices: [500, 1500, 4000, 10000]
      radius: 2.5
      percent-per-level: 10
    shield_breaker:            # a blocking target's shield stays disabled longer
      max: 5
      prices: [300, 900, 2500, 6000]
      base-ticks: 100
      ticks-per-level: 40
    berserk:                   # more damage while you are hurt
      max: 5
      prices: [400, 1200, 3000, 8000]
      health-threshold-percent: 50
      bonus-percent-per-level: 4
    hamstring:                 # chance to slow the target
      max: 5
      prices: [300, 900, 2500, 6000]
      chance-per-level: 8
      seconds: 2
      slow-amplifier: 0
    timber:                    # chance to fell the whole tree when you chop a log (respects build protection)
      max: 5
      prices: [300, 900, 2500, 6000]
      chance-per-level: 20
      max-blocks: 40

# ===================================================================================================
# SERVER HEALTH, NEW PLAYERS, AND BOUNTIES
# ===================================================================================================

# Rolling backups of every data file (stats, regions, mines, pads, ranks, clans, titles, enchants, config).
# They go into plugins/BoxPvP/backups/<date_time>/ . To restore: stop the server and copy the files back.
# A backup is also taken every time the server starts. (Data files are also written crash-safely.)
backups:
  enabled: true
  interval-minutes: 60
  keep: 24                     # how many backup folders to keep

# AFK players standing in a PvP area (and not in combat) are moved to spawn so they aren't free kills.
# Players with the permission boxpvp.afk.bypass, and creative players, are never treated as AFK.
afk:
  enabled: true
  after-seconds: 180
  kick-after-seconds: 0        # extra seconds AFK before a kick (0 = never kick)

# Damage immunity after respawning. It ends instantly if the player attacks someone.
respawn-protection:
  seconds: 5

# Bounties: a player on a kill streak of min-streak or more carries a bounty that grows with every extra kill.
# Whoever ends the streak collects it (on top of the normal kill coins). Check them with /bounties.
# (If you want bounties to be the only streak-break reward, set coins.streak-break-bonus to 0.)
bounty:
  enabled: true
  min-streak: 5
  base: 50                     # bounty at min-streak
  per-extra-kill: 25           # added for every kill beyond min-streak
  max: 1000
  announce-every: 5            # after the first announcement, announce again every N extra kills

# /guide menu and the welcome new players get on their first join. Up to 9 topics.
# icon = any item name. lines = what is shown (colour codes with &).
guide:
  first-join:
    title: "&6&lBOX PVP"
    subtitle: "&7Type &e/guide &7to get started"
    messages:
      - "&6&lWelcome to Box PvP!"
      - "&7Mine resources, sell them, upgrade your gear and fight in the arena."
      - "&7Type &e/guide &7any time to see how everything works."
  topics:
    - icon: COMPASS
      name: "&e&lGetting started"
      lines:
        - "&7You respawn at spawn and keep your inventory when you die."
        - "&7Step on a &6gold block pad &7to be carried into the arena."
        - "&7Spawn is a safe zone - nobody can hurt you there."
    - icon: IRON_PICKAXE
      name: "&e&lMining and selling"
      lines:
        - "&7Mines drop auto-smelted resources and refill after a few seconds."
        - "&7Better ores need a better pickaxe (stone for iron, iron for gold/diamond)."
        - "&7Sell resources to the &bBuyer &7and buy supplies from the &6Seller &7at spawn."
    - icon: DIAMOND_SWORD
      name: "&e&lCombat"
      lines:
        - "&7Kills earn coins; streaks earn bigger rewards and put a &6bounty &7on you."
        - "&7After you hit someone you're &ccombat-tagged&7: no /spawn and no entering safe zones."
        - "&7Helping kill someone earns an assist. See &e/bounties&7."
    - icon: ENCHANTED_BOOK
      name: "&e&lUpgrades and enchants"
      lines:
        - "&7The &5Upgrader &7adds normal enchants to a pickaxe, sword or axe for coins."
        - "&7The &dEnchanter &7sells random custom enchants - apply them at the Upgrader."
        - "&7Tools have limited custom-enchant slots; you can buy more."
    - icon: NAME_TAG
      name: "&e&lRanks, titles and clans"
      lines:
        - "&7Achievement titles unlock as you mine, fight and trade. Use &e/title&7."
        - "&7Staff give out ranks and clan tags. They show as [rank] name [clan]."
    - icon: BOOK
      name: "&e&lUseful commands"
      lines:
        - "&e/stats &7- your numbers   &e/top &7- leaderboards   &e/pay &7- send coins"
        - "&e/title &7- your titles   &e/bounties &7- who has a bounty   &e/spawn &7- go home"
